# ==============================================================================
# ChatBotColab — Docker Compose (Vertex AI Edition)
# ==============================================================================
# No GPU required!
#
# Usage:
#   docker compose up -d          # Khởi chạy
#   docker compose logs -f        # Xem logs
#   docker compose down            # Dừng
# ==============================================================================

services:
  chatbot:
    build: .
    container_name: chatbot-colab
    restart: unless-stopped

    ports:
      - "${BACKEND_PORT:-8000}:8000"    # FastAPI API
      - "${STREAMLIT_PORT:-8501}:8501"  # Streamlit UI

    env_file:
      - .env

    volumes:
      # Persist vector DB và tài liệu trên host
      - ./data:/app/data

    # Resource limits cho GCP
    deploy:
      resources:
        limits:
          memory: 14G
          cpus: "3.5"
        reservations:
          memory: 4G
          cpus: "2.0"

    # Logging config cho GCP Cloud Logging
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
